services:
  postgres:
    image: postgres:16-alpine
    container_name: neoforma-postgres
    environment:
      POSTGRES_USER: neoforma
      POSTGRES_PASSWORD: neoforma
      POSTGRES_DB: neoforma
    ports:
      - "5433:5432"
    volumes:
      - neoforma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoforma -d neoforma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neoforma-redis
    ports:
      - "6379:6379"

  # ML solvabilité — docker compose --profile ml up -d neoscore-ml
  neoscore-ml:
    profiles: ["ml"]
    build:
      context: ./services/neoscore
    container_name: neoforma-neoscore-ml
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"

volumes:
  neoforma_pg:
