# Render Blueprint — API NeoForma + Postgres + Redis + ML solvabilité + worker.
# https://render.com → New → Blueprint → pointer sur ce repo.
# Secrets (sync: false) à renseigner dans le dashboard après le 1er deploy.
databases:
  - name: neoforma-db
    databaseName: neoforma
    user: neoforma
    plan: free

services:
  - type: keyvalue
    name: neoforma-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: neoforma-ml
    runtime: docker
    plan: free
    dockerfilePath: ./services/neoscore/Dockerfile
    dockerContext: ./services/neoscore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: neoforma-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    # /health = process vivant. Ne pas sonder /ready ici : une base
    # encore endormie (plan free) renvoyait 503 et Render tuait l’instance.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neoforma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: neoforma-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: USE_JOB_QUEUE
        value: "1"
      - key: CORS_ORIGIN
        sync: false
      - key: SCORING_ML_URL
        fromService:
          name: neoforma-ml
          type: web
          property: host
      - key: SCORING_ML_TIMEOUT_MS
        value: "8000"
      - key: ADMIN_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: PARTNER_API_KEY
        sync: false
      - key: KOBO_API_KEY
        sync: false
      - key: ORANGE_MM_URL
        sync: false
      - key: ORANGE_MM_API_KEY
        sync: false
      - key: ORANGE_MM_TOKEN_URL
        sync: false
      - key: ORANGE_MM_CLIENT_ID
        sync: false
      - key: ORANGE_MM_CLIENT_SECRET
        sync: false
      - key: MOOV_MM_URL
        sync: false
      - key: MOOV_MM_API_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: BRAND_APP_NAME
        sync: false
      - key: BRAND_PRIMARY_COLOR
        sync: false
      - key: BRAND_SECONDARY_COLOR
        sync: false
      - key: BRAND_LOGO_URL
        sync: false
      - key: BRAND_SUPPORT_PHONE
        sync: false

  - type: worker
    name: neoforma-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neoforma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: neoforma-redis
          type: keyvalue
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: USE_JOB_QUEUE
        value: "1"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ORANGE_MM_URL
        sync: false
      - key: ORANGE_MM_API_KEY
        sync: false
      - key: ORANGE_MM_TOKEN_URL
        sync: false
      - key: ORANGE_MM_CLIENT_ID
        sync: false
      - key: ORANGE_MM_CLIENT_SECRET
        sync: false
      - key: MOOV_MM_URL
        sync: false
      - key: MOOV_MM_API_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
