services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neoforma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neoforma}
      POSTGRES_DB: neoforma
    volumes:
      - neoforma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoforma -d neoforma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://neoforma:${POSTGRES_PASSWORD:-neoforma}@postgres:5432/neoforma?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-neoforma-prod-change-me-min-32-chars!!}
      PORT: "3001"
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  neoforma_pg:
