# Render Blueprint — API NeoForma + Postgres + Redis + ML solvabilité.
# https://render.com → New → Blueprint → pointer sur ce repo.
#
# Always-on : Free web s’endort après 15 min d’inactivité (1er appel ~1 min).
# Free Postgres expire à 30 jours. Starter API (~7 $/mois) + Basic-256mb DB
# (~6 $/mois) restent allumés. Carte bancaire requise sur le compte Render.
# ML reste Free (optionnel, peut s’endormir).
databases:
  - name: neoforma-db
    databaseName: neoforma
    user: neoforma
    # 0.1 CPU / 256 MB — plus d’expiration 30 j. Ancien id : basic-256mb.
    plan: 0.1c-256mb

services:
  - type: keyvalue
    name: neoforma-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    # Accès interne uniquement (API sur le même compte Render).
    ipAllowList: []

  - type: web
    name: neoforma-ml
    runtime: docker
    plan: free
    dockerfilePath: ./services/neoscore/Dockerfile
    dockerContext: ./services/neoscore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: neoforma-api
    runtime: docker
    # 0.5 CPU / 512 MB — ne s’endort pas. Ancien id : starter (~7 $/mois).
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    # /health répond dès que le process écoute (avant Postgres).
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neoforma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: neoforma-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render injecte PORT automatiquement — ne pas le forcer.
      # À renseigner dans le dashboard Render :
      - key: CORS_ORIGIN
        sync: false
      # Après le 1er deploy ML : https://neoforma-ml-xxxx.onrender.com
      - key: SCORING_ML_URL
        sync: false
      - key: SCORING_ML_TIMEOUT_MS
        value: "8000"
      - key: ADMIN_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: PARTNER_API_KEY
        sync: false
      - key: KOBO_API_KEY
        sync: false
      - key: ORANGE_MM_URL
        sync: false
      - key: ORANGE_MM_API_KEY
        sync: false
      - key: MOOV_MM_URL
        sync: false
      - key: MOOV_MM_API_KEY
        sync: false
      - key: BRAND_APP_NAME
        sync: false
      - key: BRAND_PRIMARY_COLOR
        sync: false
      - key: BRAND_SECONDARY_COLOR
        sync: false
      - key: BRAND_LOGO_URL
        sync: false
      - key: BRAND_SUPPORT_PHONE
        sync: false
