name: neoforma
description: NeoForma — inclusion financière, secteur informel Burkina Faso
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  speech_to_text: ^7.0.0
  share_plus: ^11.0.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/audio/
    - assets/audio/fr/
    - assets/audio/mr/
